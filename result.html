
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Your Result — UTMESchools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ---- Score hero ---- */
  .result-hero{
    background:var(--navy); padding:24px 16px; text-align:center; color:#fff;
  }
  .score-ring-wrap{
    display:flex; justify-content:center; margin-bottom:14px;
  }
  .score-ring{position:relative; width:130px; height:130px;}
  .score-ring svg{width:130px; height:130px; transform:rotate(-90deg);}
  .score-ring-track{fill:none; stroke:rgba(255,255,255,0.12); stroke-width:10;}
  .score-ring-fill{fill:none; stroke:var(--gold); stroke-width:10; stroke-linecap:round;
    stroke-dasharray:0 345; transition:stroke-dasharray 1s ease;}
  .score-ring-inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-pct{
    font-family:var(--font-mono); font-size:24px; font-weight:700; color:#fff;
  }
  .score-pct-label{font-size:10px; color:#9FB0CB; margin-top:1px; letter-spacing:0.06em;}
  .result-total{
    font-family:var(--font-mono); font-size:19px; font-weight:700; color:#fff; margin-bottom:4px;
  }
  .result-meta{font-size:11.5px; color:#9FB0CB; line-height:1.7;}
  .result-meta span{margin:0 5px;}

  /* ---- Sections ---- */
  .sec{padding:20px 14px;}
  .sec h2{font-size:16px; margin-bottom:12px;}

  /* ---- Per-subject bars ---- */
  .subject-bar-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px; margin-bottom:10px;
  }
  .sb-head{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .sb-icon{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px;}
  .sb-name{font-weight:700; font-size:13px; flex:1;}
  .sb-score{font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--navy);}
  .sb-pct-badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    padding:3px 9px; border-radius:99px;
  }
  .sb-bar-track{
    height:8px; background:var(--paper-dim); border-radius:99px; overflow:hidden;
  }
  .sb-bar-fill{height:100%; border-radius:99px; transition:width 0.8s ease; width:0%;}

  /* ---- Topic table ---- */
  .topic-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .topic-table th{
    text-align:left; padding:8px 10px; background:var(--paper-dim);
    font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .topic-table td{padding:9px 10px; border-top:1px solid var(--line);}
  .topic-table tr:hover td{background:var(--paper-dim);}
  .topic-rank{
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper-dim); color:var(--ink-soft);
  }
  .topic-score-cell{font-family:var(--font-mono); font-weight:700; color:var(--navy);}
  .topic-mini-bar{width:60px; height:6px; background:var(--paper-dim); border-radius:99px; overflow:hidden;}
  .topic-mini-fill{height:100%; border-radius:99px;}

  /* ---- Action buttons ---- */
  .action-row{
    display:flex; flex-direction:column; gap:8px; padding:20px 14px;
    border-top:1px solid var(--line);
  }

  /* ---- Corrections view ---- */
  .corrections-section{display:none; padding:14px 14px 80px;}
  .correction-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
    margin-bottom:12px; overflow:hidden;
  }
  .cc-header{
    padding:10px 14px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--line);
  }
  .cc-num{
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    background:var(--paper-dim); padding:3px 9px; border-radius:99px; color:var(--ink-soft);
  }
  .cc-subject{font-size:10px; color:var(--ink-soft); flex:1;}
  .cc-result-icon{font-size:14px;}
  .cc-question{padding:12px 14px; font-size:13.5px; line-height:1.6; border-bottom:1px solid var(--line);}
  .cc-options{padding:8px 14px;}
  .cc-option{
    display:flex; align-items:flex-start; gap:8px; padding:7px 0;
    border-top:1px solid #F4F2EC; font-size:12.5px;
  }
  .cc-opt-letter{
    font-family:var(--font-mono); font-size:11px; font-weight:700; min-width:18px;
    color:var(--ink-soft);
  }
  .cc-opt-text{flex:1; line-height:1.5;}
  .cc-option.correct{ color:var(--green); }
  .cc-option.correct .cc-opt-letter{ color:var(--green); }
  .cc-option.wrong{ color:#C0392B; }
  .cc-option.wrong .cc-opt-letter{ color:#C0392B; }
  .cc-option.chosen-wrong{ background:#FEF0F0; border-radius:6px; padding:7px 8px; margin:0 -8px; }
  .cc-explanation{
    padding:12px 14px; background:#E7F8EF; border-top:1px solid #A8DCC0;
    font-size:12.5px; line-height:1.65; color:var(--ink);
  }
  .cc-exp-label{font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--green); margin-bottom:6px;}
</style>
</head>
<body>

<header class="appbar">
  <button class="appbar-back" onclick="window.location.href='select-subjects.html'" aria-label="Back">←</button>
  <span class="appbar-title">Your Result</span>
  <button class="appbar-burger" id="menuOpenBtn" aria-label="Menu">☰</button>
</header>

<main>
  <!-- ============ Score hero ============ -->
  <div class="result-hero">
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 130 130">
          <circle class="score-ring-track" cx="65" cy="65" r="55"/>
          <circle class="score-ring-fill" id="ringFill" cx="65" cy="65" r="55"/>
        </svg>
        <div class="score-ring-inner">
          <div class="score-pct" id="scorePct">0%</div>
          <div class="score-pct-label">SCORE</div>
        </div>
      </div>
    </div>
    <div class="result-total" id="resultTotal">0 / 0</div>
    <div class="result-meta" id="resultMeta"></div>
  </div>

  <!-- ============ Results view ============ -->
  <div id="resultsView">
    <!-- Per-subject breakdown -->
    <div class="sec">
      <h2>Subject breakdown</h2>
      <div id="subjectBars"></div>
    </div>

    <!-- Topic analysis -->
    <div class="sec" style="background:var(--paper-dim); padding-top:16px; padding-bottom:16px;">
      <h2>Topic performance</h2>
      <div id="topicTables"></div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="btn btn-primary btn-block" id="viewCorrectionBtn">📋 View Corrections</button>
      <a href="select-subjects.html" class="btn btn-ghost btn-block">🔄 Try Again</a>
      <button class="btn btn-ghost btn-block" id="shareBtn">📤 Share Result</button>
    </div>
  </div>

  <!-- ============ Corrections view ============ -->
  <div class="corrections-section" id="correctionsView">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h2 style="font-size:16px;margin:0;">Corrections</h2>
      <button class="btn btn-ghost btn-sm" id="backToResultBtn">← Back to result</button>
    </div>
    <div id="correctionsList"></div>
  </div>
</main>

<!-- Hamburger menu -->
<div class="menu-overlay" id="menuOverlay">
  <div class="menu-panel">
    <button class="menu-close" id="menuCloseBtn">×</button>
    <div class="menu-head">
      <div class="appbar-mark">U</div>
      <div><div class="menu-head-name">UTMESchools</div><div class="menu-head-sub">JAMB · UTME Practice</div></div>
    </div>
    <nav class="menu-list">
      <a href="index.html"><span class="menu-icon">🏠</span> Home</a>
      <a href="select-subjects.html"><span class="menu-icon">📚</span> Practice for UTME</a>
      <a href="dashboard.html"><span class="menu-icon">📊</span> Result History</a>
      <a href="bookmarks.html"><span class="menu-icon">🔖</span> Bookmarks</a>
    </nav>
  </div>
</div>

<script src="shared.js"></script>
<script src="results.js"></script>
</body>
      </html>
