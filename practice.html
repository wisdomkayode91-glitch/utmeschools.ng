<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — UTMESchools</title>
<link rel="stylesheet" href="shared.css">
<style>

/* ============================================================
   PRACTICE PAGE — Bold, clean, organized
   ============================================================ */

body { background: #F4F6FA; }

/* ---- TOP TOOLBAR ---- */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 200;
  background: #0B2545;
  height: 54px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
}
.tb-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 17px;
  flex-shrink: 0;
  border: none; cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.tb-btn:hover  { background: rgba(255,255,255,0.18); }
.tb-btn:active { background: rgba(255,255,255,0.28); }
.tb-btn.gold   { color: var(--gold); }

.tb-center { flex: 1; display: flex; flex-direction: column; align-items: center; }
.tb-subject {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.tb-mode {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.tb-timer {
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 5px 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.tb-timer.warn   { background: rgba(230,126,34,0.3); color: #F39C12; }
.tb-timer.danger { background: rgba(192,57,43,0.3);  color: #E74C3C; }

/* ---- SUBJECT TABS ---- */
.subj-tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: #fff;
  border-bottom: 2px solid #E8EBF0;
  position: sticky;
  top: 54px;
  z-index: 190;
}
.subj-tabs::-webkit-scrollbar { display: none; }
.subj-tab {
  flex-shrink: 0;
  padding: 10px 16px;
  font-size: 12.5px;
  font-weight: 700;
  color: #8A94A6;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.subj-tab.active {
  color: #0B2545;
  border-bottom-color: #FF6B35;
}
.subj-tab-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #F0F2F5;
  border-radius: 99px;
  padding: 1px 7px;
  font-size: 10px;
  margin-left: 4px;
  color: #8A94A6;
}
.subj-tab.active .subj-tab-pill {
  background: #FF6B35;
  color: #fff;
}

/* ---- Q NAVIGATOR ---- */
.q-nav-bar {
  background: #fff;
  border-bottom: 1px solid #E8EBF0;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.q-nav-arrow {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: #F4F6FA;
  border: 1.5px solid #E8EBF0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: #0B2545;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
}
.q-nav-arrow:disabled { opacity: 0.3; pointer-events: none; }
.q-nav-arrow:active { background: #E8EBF0; }

.q-progress-wrap { flex: 1; }
.q-progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
}
.q-num-label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: #0B2545;
}
.q-answered-label {
  font-size: 11px;
  color: #8A94A6;
}
.q-progress-track {
  height: 5px;
  background: #E8EBF0;
  border-radius: 99px;
  overflow: hidden;
}
.q-progress-fill {
  height: 100%;
  background: #FF6B35;
  border-radius: 99px;
  transition: width 0.4s ease;
}

.q-speaker {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: #F4F6FA;
  border: 1.5px solid #E8EBF0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ---- PASSAGE ---- */
.passage-box {
  background: #EEF8F3;
  border-left: 4px solid #0FA968;
  border-radius: 0 12px 12px 0;
  padding: 14px 16px;
  margin: 12px 12px 0;
  display: none;
}
.passage-box.show { display: block; }
.passage-label {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #0FA968;
  margin-bottom: 6px;
}
.passage-text {
  font-size: 13.5px;
  line-height: 1.7;
  color: #0B2545;
}
.passage-toggle {
  font-size: 11px;
  font-weight: 700;
  color: #0FA968;
  cursor: pointer;
  margin-top: 6px;
  display: inline-block;
}

/* ---- QUESTION CARD ---- */
.q-card {
  background: #fff;
  border-radius: 16px;
  margin: 12px;
  padding: 18px;
  box-shadow: 0 2px 12px rgba(11,37,69,0.07);
}
.q-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.q-tag {
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  background: #F0F2F5;
  color: #5C6B82;
}
.q-tag.year { background: #EEF4FF; color: #1F5FBF; }
.q-tag.topic { background: #FFF4DC; color: #A6760A; }
.q-tag.difficulty-basic        { background: #D4F6E8; color: #0A6B40; }
.q-tag.difficulty-intermediate { background: #FFF4DC; color: #A6760A; }
.q-tag.difficulty-advanced     { background: #FCE4E4; color: #C0392B; }

.q-text {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.65;
  color: #0B2545;
}
.q-image {
  margin-top: 12px;
  border-radius: 10px;
  overflow: hidden;
}
.q-image img { width: 100%; display: block; }

/* ---- OPTIONS ---- */
.options-wrap { padding: 0 12px 12px; }
.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  background: #fff;
  border: 2px solid #E8EBF0;
  border-radius: 14px;
  padding: 14px 14px;
  margin-bottom: 8px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s, transform 0.08s;
  -webkit-tap-highlight-color: transparent;
}
.option-btn:active { transform: scale(0.98); }
.option-btn.selected {
  border-color: #0B2545;
  background: #EEF4FF;
}
.option-btn.correct {
  border-color: #0FA968;
  background: #E8F8F1;
}
.option-btn.wrong {
  border-color: #C0392B;
  background: #FDECEA;
}
.option-btn.dimmed { opacity: 0.4; }

.option-letter-box {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: #F0F2F5;
  border: 2px solid #E0DCD0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  color: #5C6B82;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.option-btn.selected .option-letter-box {
  background: #0B2545; border-color: #0B2545; color: #fff;
}
.option-btn.correct .option-letter-box {
  background: #0FA968; border-color: #0FA968; color: #fff;
}
.option-btn.wrong .option-letter-box {
  background: #C0392B; border-color: #C0392B; color: #fff;
}
.option-text {
  font-size: 14.5px;
  line-height: 1.5;
  color: #0B2545;
  padding-top: 5px;
  flex: 1;
}

/* ---- EXPLANATION BOX ---- */
.explanation-box {
  background: #FFFBEC;
  border: 1.5px solid #F0D58C;
  border-radius: 14px;
  padding: 16px;
  margin: 0 12px 12px;
  display: none;
}
.explanation-box.show { display: block; }
.explanation-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.explanation-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: #F0D58C;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.explanation-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 800;
  color: #0B2545;
}
.explanation-text {
  font-size: 13.5px;
  line-height: 1.65;
  color: #2C3E50;
}

/* ---- STUDY MODE SHOW ANSWER ---- */
.show-answer-wrap {
  padding: 0 12px 12px;
  display: none;
}
.show-answer-wrap.show { display: block; }
.show-answer-btn {
  width: 100%;
  padding: 14px;
  background: #fff;
  border: 2px dashed #CBD0DA;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  color: #0B2545;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.show-answer-btn:active { background: #F4F6FA; }

/* ---- BOTTOM BAR ---- */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: #fff;
  border-top: 1.5px solid #E8EBF0;
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 -4px 16px rgba(11,37,69,0.06);
}
.answered-counter {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #F4F6FA;
  border: 1.5px solid #E8EBF0;
  border-radius: 10px;
  padding: 9px 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.answered-nums {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  color: #0B2545;
}
.answered-lbl { font-size: 11px; color: #8A94A6; }

.submit-btn {
  background: #FF6B35;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px 20px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.submit-btn:active { background: #E2531F; }

/* ---- GRID OVERLAY ---- */
.grid-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(11,37,69,0.55);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.grid-overlay.open { opacity: 1; pointer-events: all; }
.grid-panel {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%; max-height: 72vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.grid-overlay.open .grid-panel { transform: translateY(0); }
.grid-handle {
  width: 36px; height: 4px;
  background: #E0DCD0; border-radius: 2px;
  margin: 10px auto 0;
  flex-shrink: 0;
}
.grid-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid #E8EBF0;
  flex-shrink: 0;
}
.grid-top-title { font-family: var(--font-display); font-size: 15px; font-weight: 800; color: #0B2545; }
.grid-close-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: #F4F6FA;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #0B2545;
  border: none; cursor: pointer;
}
.grid-legend {
  display: flex; gap: 16px;
  padding: 10px 16px;
  border-bottom: 1px solid #E8EBF0;
  flex-shrink: 0;
}
.grid-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #5C6B82; }
.grid-legend-dot { width: 12px; height: 12px; border-radius: 4px; }
.grid-body { flex: 1; overflow-y: auto; padding: 14px; }
.grid-nums {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 7px;
}
.grid-num {
  height: 44px;
  border-radius: 10px;
  border: 2px solid #E8EBF0;
  background: #F4F6FA;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 700;
  color: #8A94A6;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s, border-color 0.1s;
}
.grid-num.answered { background: #0B2545; border-color: #0B2545; color: #fff; }
.grid-num.current  { border-color: #FF6B35; color: #FF6B35; }
.grid-num.answered.current { background: #FF6B35; border-color: #FF6B35; color: #fff; }

/* ---- SUBMIT DIALOG ---- */
.dialog-overlay {
  position: fixed; inset: 0; z-index: 800;
  background: rgba(11,37,69,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.dialog-overlay.open { opacity: 1; pointer-events: all; }
.dialog-box {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  width: 100%; max-width: 340px;
  box-shadow: 0 20px 60px rgba(11,37,69,0.2);
  transform: scale(0.95);
  transition: transform 0.2s;
}
.dialog-overlay.open .dialog-box { transform: scale(1); }
.dialog-icon { font-size: 36px; text-align: center; margin-bottom: 10px; }
.dialog-title { font-family: var(--font-display); font-size: 17px; font-weight: 800; color: #0B2545; margin-bottom: 8px; text-align: center; }
.dialog-body  { font-size: 13.5px; color: #5C6B82; line-height: 1.5; text-align: center; margin-bottom: 20px; }
.dialog-actions { display: flex; gap: 10px; }
.dialog-actions .btn { flex: 1; }

/* ---- CALCULATOR ---- */
.calc-overlay {
  position: fixed; inset: 0; z-index: 700;
  background: rgba(11,37,69,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.calc-overlay.open { opacity: 1; pointer-events: all; }
.calc-panel {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 400px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.calc-overlay.open .calc-panel { transform: translateY(0); }
.calc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 10px;
  border-bottom: 1px solid #E8EBF0;
}
.calc-header-title { font-family: var(--font-display); font-size: 14px; font-weight: 800; color: #0B2545; }
.calc-close {
  width: 30px; height: 30px; border-radius: 8px;
  background: #F4F6FA; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #0B2545;
}
.calc-screen {
  padding: 14px 16px 8px;
  font-family: var(--font-mono);
  font-size: 30px;
  font-weight: 700;
  color: #0B2545;
  text-align: right;
  background: #F4F6FA;
  min-height: 60px;
  word-break: break-all;
}
.calc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #E8EBF0;
}
.calc-key {
  background: #fff;
  padding: 18px 8px;
  font-family: var(--font-mono);
  font-size: 18px; font-weight: 700;
  color: #0B2545;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
  border: none;
  user-select: none;
}
.calc-key:active { background: #F4F6FA; }
.calc-key.op  { color: #0B2545; font-size: 20px; background: #F0F2F5; }
.calc-key.fn  { color: #5C6B82; font-size: 14px; background: #F0F2F5; }
.calc-key.eq  { background: #FF6B35; color: #fff; }
.calc-key.eq:active { background: #E2531F; }
.calc-key.del { background: #FFF0EB; color: #E2531F; }
.calc-key.clr { background: #FFF0EB; color: #C0392B; }

/* ---- Page bottom padding ---- */
.page-bottom-pad { height: 80px; }

/* ---- Free mode paywall ---- */
.free-banner {
  background: linear-gradient(135deg, #0B2545, #163461);
  border-radius: 16px;
  padding: 20px;
  margin: 12px;
  text-align: center;
  color: #fff;
}
.free-banner h3 { font-family: var(--font-display); font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.free-banner p  { font-size: 13px; opacity: 0.8; margin-bottom: 14px; line-height: 1.5; }
</style>
</head>

}

}
