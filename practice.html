<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — UTMESchools</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ---- Toolbar ---- */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--navy);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  height: 52px;
  flex-shrink: 0;
}
.toolbar-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 17px;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.toolbar-btn:hover { background: rgba(255,255,255,0.22); }
.toolbar-btn.active { background: var(--gold); color: var(--navy); }
.toolbar-spacer { flex: 1; }
.timer-pill {
  background: rgba(255,255,255,0.15);
  border-radius: var(--radius-pill);
  padding: 5px 12px;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.timer-pill.warn  { background: var(--amber); color: #fff; }
.timer-pill.danger{ background: var(--red);   color: #fff; }

/* ---- Subject tabs ---- */
.subj-tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--white);
  border-bottom: 2px solid var(--line);
  position: sticky;
  top: 52px;
  z-index: 90;
}
.subj-tabs::-webkit-scrollbar { display: none; }
.subj-tab {
  flex-shrink: 0;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.subj-tab.active { color: var(--navy); border-bottom-color: var(--orange); }
.subj-tab-count {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--paper-dim);
  border-radius: var(--radius-pill);
  padding: 1px 6px;
  margin-left: 4px;
}

/* ---- Question nav ---- */
.q-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
}
.q-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--paper-dim);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--ink);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.q-nav-btn:disabled { opacity: 0.35; }
.q-pill {
  flex: 1;
  background: var(--paper-dim);
  border-radius: var(--radius-pill);
  padding: 7px 12px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.speaker-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}

/* ---- Passage card ---- */
.passage-card {
  background: #EEF8F3;
  border: 1px solid #B2DFC8;
  border-radius: var(--radius-md);
  padding: 14px;
  margin: 14px 14px 0;
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  display: none;
}
.passage-card.visible { display: block; }
.passage-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #0A6B40;
  margin-bottom: 6px;
}

/* ---- Question card ---- */
.q-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  margin: 14px;
  padding: 16px;
  box-shadow: var(--shadow-card);
}
.q-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.q-meta-tag {
  font-size: 11px;
  font-weight: 600;
  background: var(--paper-dim);
  border-radius: var(--radius-pill);
  padding: 3px 10px;
  color: var(--ink-soft);
}
.q-text {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--ink);
  margin-bottom: 4px;
}
.q-svg { margin: 12px 0; }

/* ---- Options ---- */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 14px 14px;
}
.option-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--white);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.15s, background 0.15s;
}
.option-row:active { background: var(--paper-dim); }
.option-row.selected {
  border-color: var(--navy);
  background: #EEF4FF;
}
.option-row.correct {
  border-color: var(--green);
  background: #E8F8F1;
}
.option-row.wrong {
  border-color: var(--red);
  background: #FDECEA;
}
.option-row.dimmed {
  opacity: 0.45;
}
.option-letter {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--paper-dim);
  border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  flex-shrink: 0;
}
.option-row.selected  .option-letter { background: var(--navy);  border-color: var(--navy);  color: #fff; }
.option-row.correct   .option-letter { background: var(--green); border-color: var(--green); color: #fff; }
.option-row.wrong     .option-letter { background: var(--red);   border-color: var(--red);   color: #fff; }
.option-text { font-size: 14.5px; line-height: 1.5; padding-top: 3px; }

/* ---- Explanation box ---- */
.explanation-box {
  background: #FFF8E6;
  border: 1px solid #F0D58C;
  border-radius: var(--radius-md);
  padding: 14px;
  margin: 0 14px 14px;
  display: none;
}
.explanation-box.visible { display: block; }
.explanation-box h4 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
}
.explanation-text {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink);
}

/* ---- Study actions ---- */
.study-actions {
  padding: 0 14px 14px;
  display: none;
}
.study-actions.visible { display: block; }

/* ---- Bottom bar ---- */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: var(--white);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
.answered-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--paper-dim);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 8px 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  flex: 1;
}
.answered-pill-num {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
}
.answered-pill-label {
  font-size: 12.5px;
  color: var(--ink-soft);
}
.page-bottom-pad { height: 80px; }

/* ---- Question grid ---- */
.grid-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(11,37,69,0.5);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.grid-overlay.open { opacity: 1; pointer-events: all; }
.grid-panel {
  background: var(--white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%; max-height: 70vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.grid-overlay.open .grid-panel { transform: translateY(0); }
.grid-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.grid-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.grid-close {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--paper-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--ink);
}
.grid-legend {
  display: flex; gap: 14px; padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.grid-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.grid-legend-dot { width: 14px; height: 14px; border-radius: 3px; }
.grid-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.grid-nums {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
  gap: 6px;
}
.grid-num {
  height: 42px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--line);
  background: var(--paper-dim);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s, border-color 0.1s;
}
.grid-num.answered { background: var(--navy); border-color: var(--navy); color: #fff; }
.grid-num.current  { border-color: var(--orange); color: var(--orange); }
.grid-num.answered.current { background: var(--orange); border-color: var(--orange); color: #fff; }

/* ---- Paywall card ---- */
.paywall-inline {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  border-radius: var(--radius-lg);
  padding: 28px 20px;
  margin: 14px;
  text-align: center;
  color: #fff;
}
.paywall-inline h3 { font-family:var(--font-display); font-size:18px; font-weight:800; margin-bottom:8px; }
.paywall-inline p  { font-size:13.5px; opacity:.85; margin-bottom:16px; line-height:1.5; }
.paywall-inline .price { font-family:var(--font-mono); font-size:28px; font-weight:700; color:var(--gold); margin-bottom:16px; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="toolbar-btn" id="backBtn" aria-label="Back">←</button>
  <div class="toolbar-spacer"></div>
  <button class="toolbar-btn" id="bookmarkBtn" title="Bookmark">🔖</button>
  <button class="toolbar-btn" id="flagBtn" title="Report">🚩</button>
  <button class="toolbar-btn" id="calcBtn" title="Calculator">🧮</button>
  <div class="timer-pill" id="timerPill">2:00:00</div>
</div>

<!-- SUBJECT TABS -->
<div class="subj-tabs" id="subjTabs"></div>

<!-- QUESTION NAV -->
<div class="q-nav">
  <button class="q-nav-btn" id="prevBtn" aria-label="Previous">‹</button>
  <div class="q-pill">
    <span id="qLabel">Q 1 / 1</span>
    <button class="speaker-btn" id="speakerBtn" title="Read aloud">🔊</button>
  </div>
  <button class="q-nav-btn" id="nextBtn" aria-label="Next">›</button>
</div>

<!-- PASSAGE (shown when question has a passage) -->
<div class="passage-card" id="passageCard">
  <div class="passage-label">📖 Read the passage</div>
  <div id="passageText"></div>
</div>

<!-- QUESTION CARD -->
<div class="q-card" id="qCard">
  <div class="q-meta" id="qMeta"></div>
  <div class="q-text" id="qText">Loading question...</div>
  <div class="q-svg" id="qSvg"></div>
</div>

<!-- OPTIONS -->
<div class="options-list" id="optionsList"></div>

<!-- STUDY: Show/Hide answer -->
<div class="study-actions" id="studyActions">
  <button class="btn btn-ghost btn-block" id="showAnswerBtn">👁 Show Answer</button>
</div>

<!-- EXPLANATION -->
<div class="explanation-box" id="explanationBox">
  <h4>💡 Explanation</h4>
  <div class="explanation-text" id="explanationText"></div>
</div>

<!-- BOTTOM PAD -->
<div class="page-bottom-pad"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="answered-pill" id="answeredPill">
    <span class="answered-pill-num" id="answeredCount">0</span>
    <span class="answered-pill-label">/ <span id="totalCount">0</span> answered ▾</span>
  </div>
  <button class="btn btn-primary" id="submitBtn">Submit</button>
</div>

<!-- GRID OVERLAY -->
<div class="grid-overlay" id="gridOverlay">
  <div class="grid-panel">
    <div class="grid-top">
      <div class="grid-title">Question Grid</div>
      <button class="grid-close" id="gridCloseBtn">×</button>
    </div>
    <div class="grid-legend">
      <div class="grid-legend-item"><div class="grid-legend-dot" style="background:var(--navy);"></div>Answered</div>
      <div class="grid-legend-item"><div class="grid-legend-dot" style="background:var(--paper-dim); border:2px solid var(--line);"></div>Unanswered</div>
      <div class="grid-legend-item"><div class="grid-legend-dot" style="border:2px solid var(--orange);"></div>Current</div>
    </div>
    <div class="grid-body"><div class="grid-nums" id="gridNums"></div></div>
  </div>
</div>

<!-- SUBMIT DIALOG -->
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <div class="dialog-title">Submit exam?</div>
    <div class="dialog-body" id="dialogBody">Are you sure you want to submit and see your results?</div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="dialogCancel">Cancel</button>
      <button class="btn btn-primary" id="dialogSubmit">Submit</button>
    </div>
  </div>
</div>

<!-- CALCULATOR OVERLAY -->
<div class="calc-overlay" id="calcOverlay">
  <div class="calc-panel">
    <div class="calc-top">
      <div class="calc-top-title">🧮 Calculator</div>
      <button class="calc-close-btn" id="calcCloseBtn">×</button>
    </div>
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
      <button class="calc-btn clr" data-val="C">C</button>
      <button class="calc-btn fn"  data-val="√">√</button>
      <button class="calc-btn fn"  data-val="%">%</button>
      <button class="calc-btn del" data-val="DEL">⌫</button>
      <button class="calc-btn" data-val="7">7</button>
      <button class="calc-btn" data-val="8">8</button>
      <button class="calc-btn" data-val="9">9</button>
      <button class="calc-btn op" data-val="÷">÷</button>
      <button class="calc-btn" data-val="4">4</button>
      <button class="calc-btn" data-val="5">5</button>
      <button class="calc-btn" data-val="6">6</button>
      <button class="calc-btn op" data-val="×">×</button>
      <button class="calc-btn" data-val="1">1</button>
      <button class="calc-btn" data-val="2">2</button>
      <button class="calc-btn" data-val="3">3</button>
      <button class="calc-btn op" data-val="-">−</button>
      <button class="calc-btn" data-val="0" style="grid-column:span 2;">0</button>
      <button class="calc-btn" data-val=".">.</button>
      <button class="calc-btn op" data-val="+">+</button>
      <button class="calc-btn eq" data-val="=" style="grid-column:span 4;">=</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="practice.js"></script>
</body>
</html>
