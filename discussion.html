<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussion — UTMESchools</title>
<link rel="stylesheet" href="shared.css">
<style>
.notice-bar {
  background: #E8F8F1; border-bottom: 1px solid #B2DFC8;
  padding: 10px 14px; font-size: 13px; color: #0A6B40;
  display: flex; align-items: center; gap: 8px;
}
.subject-filter-strip {
  display: flex; overflow-x: auto; scrollbar-width: none;
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 0 8px; gap: 4px;
  position: sticky; top: var(--appbar-h); z-index: 80;
}
.subject-filter-strip::-webkit-scrollbar { display: none; }
.sf-pill {
  flex-shrink: 0; padding: 10px 12px;
  font-size: 13px; font-weight: 600; color: var(--ink-soft);
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s, border-color 0.15s;
}
.sf-pill.active { color: var(--navy); border-bottom-color: var(--orange); }
.post-form {
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 14px;
}
.post-form textarea {
  width: 100%; background: var(--paper-dim);
  border: 1.5px solid var(--line); border-radius: var(--radius-md);
  padding: 10px 14px; font-size: 14px;
  color: var(--ink); resize: none; min-height: 80px;
  font-family: var(--font-body); line-height: 1.5;
}
.post-form textarea:focus { border-color: var(--navy); }
.post-form-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.comment-card {
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 14px;
}
.comment-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
}
.comment-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.comment-meta { flex: 1; }
.comment-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.comment-time { font-size: 12px; color: var(--ink-soft); }
.comment-subj { display: inline-block; font-size: 11px; font-weight: 600; background: var(--paper-dim); border-radius: var(--radius-pill); padding: 2px 8px; color: var(--ink-soft); margin-left: 6px; }
.comment-body { font-size: 14px; line-height: 1.55; color: var(--ink); margin-bottom: 10px; }
.comment-actions { display: flex; gap: 12px; }
.comment-action-btn { font-size: 13px; color: var(--ink-soft); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.comment-action-btn:hover { color: var(--navy); }
.login-prompt {
  background: var(--white); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 20px; margin: 14px;
  text-align: center;
}
</style>
</head>
<body>

<header class="appbar">
  <a href="index.html" class="appbar-back">←</a>
  <div class="appbar-title">Discussion</div>
  <button class="appbar-burger" id="menuOpenBtn">☰</button>
</header>

<div class="menu-overlay" id="menuOverlay">
  <nav class="menu-panel">
    <div class="menu-header" style="position:relative;">
      <div class="menu-brand">UTME<span>Schools</span></div>
      <div class="menu-tagline">Practice like it's exam day.</div>
      <button class="menu-close" id="menuCloseBtn">×</button>
    </div>
    <div class="menu-nav">
      <a href="index.html" class="menu-item"><div class="menu-item-icon">🏠</div>Home</a>
      <a href="select-subjects.html" class="menu-item"><div class="menu-item-icon">📚</div>Practice</a>
      <a href="dashboard.html" class="menu-item"><div class="menu-item-icon">📊</div>My Dashboard</a>
      <a href="discussion.html" class="menu-item"><div class="menu-item-icon">💬</div>Discussion</a>
      <div class="menu-divider"></div>
      <a href="auth.html" class="menu-item" id="menuLoginItem"><div class="menu-item-icon">👤</div>Log In / Sign Up</a>
      <div class="menu-item" id="menuLogoutItem" style="display:none;cursor:pointer;"><div class="menu-item-icon">🚪</div><span id="menuLogoutBtn">Log Out</span></div>
    </div>
    <div class="menu-footer">Not affiliated with JAMB. © 2026 UTMESchools</div>
  </nav>
</div>

<div class="notice-bar">📌 This board is for exam and admission questions only. Keep it educational.</div>

<div class="subject-filter-strip" id="subjectFilterStrip">
  <div class="sf-pill active" data-subj="">All</div>
</div>

<div id="postArea"></div>

<div id="commentsList"></div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="discussion.js"></script>
</body>
</html>
