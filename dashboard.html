<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard — UTMESchools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ===== Tabs ===== */
  .dash-tabs{
    display:flex; padding:0 14px; border-bottom:1px solid var(--line); background:var(--white);
  }
  .dash-tab{
    flex:1; padding:12px; text-align:center; font-size:13px; font-weight:700;
    color:var(--ink-soft); border-bottom:2.5px solid transparent; background:none; border:none;
    cursor:pointer;
  }
  .dash-tab.active{color:var(--navy); border-bottom-color:var(--navy);}

  /* ===== Tab content ===== */
  .tab-content{display:none; padding:14px;}
  .tab-content.active{display:block;}

  /* ===== Filter bar ===== */
  .filter-bar{display:flex; gap:8px; margin-bottom:12px; align-items:center;}
  .filter-bar select{
    flex:1; padding:7px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:12.5px; background:var(--white); color:var(--ink);
  }
  .filter-bar .sort-btn{
    padding:7px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--white); font-size:12.5px; font-weight:600; color:var(--ink);
    cursor:pointer; white-space:nowrap;
  }

  /* ===== Result cards ===== */
  .result-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px; margin-bottom:10px;
  }
  .result-card-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .result-card-num{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:700;
    background:var(--navy); color:#fff;
  }
  .result-card-info{flex:1; min-width:0;}
  .result-card-title{font-size:13px; font-weight:700; color:var(--navy);}
  .result-card-meta{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .result-card-badge{
    padding:3px 10px; border-radius:99px; font-family:var(--font-mono);
    font-size:10px; font-weight:700; flex-shrink:0;
  }
  .result-card-badge.green{background:#E7F8EF; color:var(--green);}
  .result-card-badge.amber{background:#FFF4DC; color:#A6760A;}
  .result-card-badge.red{background:#FCE4E4; color:#C0392B;}
  .result-card-scores{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;
  }
  .result-card-scores span{
    font-size:11px; background:var(--paper-dim); padding:3px 8px; border-radius:99px;
    color:var(--ink-soft);
  }
  .result-card-actions{display:flex; gap:8px;}
  .result-card-actions button{
    flex:1; padding:7px; border:1px solid var(--line); border-radius:8px;
    background:var(--white); font-size:11.5px; font-weight:600; color:var(--ink);
    cursor:pointer;
  }
  .result-card-actions button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ===== Expandable details ===== */
  .card-details{
    margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
    display:none;
  }
  .card-details.open{display:block;}
  .card-details button{
    display:block; width:100%; text-align:left; padding:8px 0;
    background:none; border:none; font-size:12.5px; color:var(--ink);
    cursor:pointer; border-bottom:1px solid var(--line);
  }
  .card-details button:last-child{border-bottom:none; color:#C0392B;}

  /* ===== Bookmark cards ===== */
  .bookmark-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px; margin-bottom:10px;
  }
  .bookmark-card-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .bookmark-card-icon{width:28px; height:28px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .bookmark-card-info{flex:1; min-width:0;}
  .bookmark-card-subj{font-size:13px; font-weight:700; color:var(--navy);}
  .bookmark-card-meta{font-size:11px; color:var(--ink-soft);}
  .bookmark-card-text{font-size:12.5px; line-height:1.5; color:var(--ink); margin-bottom:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bookmark-card-actions{display:flex; gap:8px;}
  .bookmark-card-actions button{
    flex:1; padding:7px; border:1px solid var(--line); border-radius:8px;
    background:var(--white); font-size:11.5px; font-weight:600; color:var(--ink);
    cursor:pointer;
  }
  .bookmark-card-actions button.danger{color:#C0392B; border-color:#FCE4E4; background:#FCE4E4;}

  /* ===== Empty state ===== */
  .empty-state{padding:50px 24px; text-align:center;}
  .empty-state .icon{font-size:36px; margin-bottom:10px;}
  .empty-state h3{font-size:15px; margin-bottom:6px;}
  .empty-state p{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px;}

  /* ===== Delete all button ===== */
  .delete-all{
    margin-top:14px; padding:10px; text-align:center;
    color:#C0392B; font-size:12.5px; font-weight:600; cursor:pointer;
    background:#FCE4E4; border-radius:var(--radius-md); border:none; width:100%;
  }

  /* ===== Confirm dialog ===== */
  .confirm-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(11,37,69,0.55);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
    padding:16px;
  }
  .confirm-overlay.open{opacity:1; pointer-events:auto;}
  .confirm-box{
    background:#fff; border-radius:var(--radius-lg); padding:22px;
    max-width:340px; width:100%; text-align:center;
  }
  .confirm-box h3{font-size:16px; margin-bottom:6px;}
  .confirm-box p{font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px;}
  .confirm-actions{display:flex; gap:8px;}
  .confirm-actions .btn{flex:1;}

  /* ===== Hamburger menu ===== */
  .menu-overlay{position:fixed; inset:0; z-index:200; background:rgba(11,37,69,0.45); opacity:0; pointer-events:none; transition:opacity 0.2s ease;}
  .menu-overlay.open{opacity:1; pointer-events:auto;}
  .menu-panel{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--white); z-index:201; transform:translateX(-100%); transition:transform 0.22s ease; display:flex; flex-direction:column; box-shadow:var(--shadow-lift);}
  .menu-overlay.open .menu-panel{transform:translateX(0);}
  .menu-head{background:var(--navy); color:#fff; padding:22px 18px; display:flex; align-items:center; gap:10px;}
  .menu-head .appbar-mark{background:var(--gold); color:var(--navy);}
  .menu-head-name{font-family:var(--font-display); font-weight:700; font-size:15px;}
  .menu-head-sub{font-size:11px; color:#9FB0CB; margin-top:1px;}
  .menu-list{padding:10px 8px; flex:1; overflow-y:auto;}
  .menu-list a{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--ink);}
  .menu-list a:hover, .menu-list a.active{background:var(--paper-dim); color:var(--navy);}
  .menu-list .menu-icon{width:20px; text-align:center; font-size:15px;}
  .menu-divider{height:1px; background:var(--line); margin:8px 12px;}
  .menu-foot{padding:14px 18px; border-top:1px solid var(--line);}
  .menu-close{position:absolute; top:16px; right:-44px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.15); color:#fff; border:none; font-size:18px;}

  /* ===== Toast ===== */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:99px;
    font-size:12.5px; font-weight:600; z-index:400;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ===== App bar ===== -->
<header class="appbar">
  <button class="appbar-back" onclick="window.location.href='index.html'" aria-label="Back">←</button>
  <span class="appbar-title">Dashboard</span>
  <button class="appbar-burger" id="menuOpenBtn" aria-label="Open menu">☰</button>
</header>

<!-- ===== Tabs ===== -->
<div class="dash-tabs">
  <button class="dash-tab active" data-tab="history">📊 Result History</button>
  <button class="dash-tab" data-tab="bookmarks">🔖 Bookmarks</button>
</div>

<!-- ===== Result History tab ===== -->
<div class="tab-content active" id="historyTab">
  <div class="filter-bar">
    <select id="historyFilter">
      <option value="all">All subjects</option>
    </select>
    <button class="sort-btn" id="historySort">Sort: Date ▾</button>
  </div>
  <div id="historyList"></div>
  <button class="delete-all" id="deleteAllHistory" style="display:none;">🗑 Delete all history</button>
</div>

<!-- ===== Bookmarks tab ===== -->
<div class="tab-content" id="bookmarksTab">
  <div class="filter-bar">
    <select id="bookmarkFilter">
      <option value="all">All subjects</option>
    </select>
  </div>
  <div id="bookmarkList"></div>
  <button class="delete-all" id="deleteAllBookmarks" style="display:none;">🗑 Delete all bookmarks</button>
</div>

<!-- ===== Confirm dialog ===== -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmText">Are you sure?</p>
    <div class="confirm-actions">
      <button class="btn btn-ghost btn-block" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary btn-block" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Hamburger menu ===== -->
<div class="menu-overlay" id="menuOverlay">
  <div class="menu-panel">
    <button class="menu-close" id="menuCloseBtn">×</button>
    <div class="menu-head">
      <div class="appbar-mark">U</div>
      <div>
        <div class="menu-head-name">UTMESchools</div>
        <div class="menu-head-sub">JAMB · UTME Practice</div>
      </div>
    </div>
    <nav class="menu-list">
      <a href="index.html"><span class="menu-icon">🏠</span> Home</a>
      <a href="select-subjects.html"><span class="menu-icon">📚</span> Practice for UTME</a>
      <a href="dashboard.html" class="active"><span class="menu-icon">📊</span> Result History</a>
      <a href="bookmarks.html"><span class="menu-icon">🔖</span> Bookmarks</a>
      <a href="discussion.html"><span class="menu-icon">💬</span> Discussion</a>
      <div class="menu-divider"></div>
      <a href="account.html"><span class="menu-icon">👤</span> My account</a>
      <a href="index.html#pricing"><span class="menu-icon">🔓</span> Unlock full access</a>
      <div class="menu-divider"></div>
      <a href="https://wa.me/2347065732365" target="_blank" rel="noopener"><span class="menu-icon">💬</span> WhatsApp support</a>
    </nav>
    <div class="menu-foot">
      <a href="auth.html" class="btn btn-ghost btn-block btn-sm">Log in / Sign up</a>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
