<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Admin — UTMESchools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ---- Login gate ---- */
  .admin-gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .gate-card{
    background:var(--white); border:1.5px solid var(--line);
    border-radius:var(--radius-lg); padding:32px 24px; width:100%; max-width:340px;
    text-align:center;
  }
  .gate-card .appbar-mark{
    width:48px; height:48px; border-radius:12px; margin:0 auto 16px;
    background:var(--navy); color:var(--gold); font-size:20px;
  }
  .gate-card h2{font-size:17px; margin-bottom:6px;}
  .gate-card p{font-size:12.5px; color:var(--ink-soft); margin-bottom:20px;}
  .gate-input{
    width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:14px; font-family:inherit;
    margin-bottom:12px; text-align:center; letter-spacing:0.15em;
  }
  .gate-input:focus{outline:none; border-color:var(--orange);}

  /* ---- Admin header ---- */
  .admin-header{
    background:var(--navy); color:#fff; padding:16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .admin-header h1{font-size:16px; color:#fff;}
  .admin-header .sub{font-size:11px; color:#9FB0CB; margin-top:2px;}
  .admin-logout{
    font-size:12px; color:var(--gold); background:none; border:none;
    font-weight:600;
  }

  /* ---- Stats cards ---- */
  .stats-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    padding:14px;
  }
  .stat-card{
    background:var(--white); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:14px; text-align:center;
  }
  .stat-num{
    font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--navy);
  }
  .stat-label{font-size:10.5px; color:var(--ink-soft); margin-top:3px;}

  /* ---- Section ---- */
  .admin-sec{padding:14px;}
  .admin-sec h2{font-size:15px; margin-bottom:12px;}
  .admin-sec h2 span{
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    background:var(--paper-dim); padding:2px 8px; border-radius:99px;
    color:var(--ink-soft); margin-left:6px;
  }

  /* ---- Search ---- */
  .admin-search{
    width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:10px 14px; font-size:13px; font-family:inherit;
    margin-bottom:12px; background:var(--white);
  }
  .admin-search:focus{outline:none; border-color:var(--orange);}

  /* ---- User table ---- */
  .user-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .user-table th{
    text-align:left; padding:8px 10px; background:var(--paper-dim);
    font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink-soft); position:sticky; top:0;
  }
  .user-table td{padding:10px; border-top:1px solid var(--line);}
  .user-table tr:hover td{background:var(--paper-dim);}
  .user-name{font-weight:700; font-size:13px; color:var(--navy);}
  .user-email{font-size:11px; color:var(--ink-soft);}
  .user-date{font-size:10.5px; color:var(--ink-soft);}
  .paid-badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    padding:2px 8px; border-radius:99px;
  }
  .paid-badge.paid{background:#E7F8EF; color:#0C8C58;}
  .paid-badge.free{background:var(--paper-dim); color:var(--ink-soft);}
  .action-btn{
    font-size:11px; font-weight:700; padding:5px 12px; border-radius:99px;
    border:none; cursor:pointer;
  }
  .action-btn.activate{background:var(--green); color:#fff;}
  .action-btn.deactivate{background:#FCE4E4; color:#C0392B;}

  /* ---- Season settings ---- */
  .season-card{
    background:var(--white); border:1.5px solid var(--line);
    border-radius:var(--radius-md); padding:14px; margin-bottom:14px;
  }
  .season-card label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    margin-bottom:5px;
  }
  .season-card input{
    border:1.5px solid var(--line); border-radius:8px;
    padding:8px 12px; font-size:13px; font-family:inherit; width:100%;
  }

  /* ---- Comments moderation ---- */
  .comment-mod{
    background:var(--white); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:12px 14px; margin-bottom:10px;
  }
  .comment-mod-body{font-size:12.5px; line-height:1.55; margin-bottom:8px;}
  .comment-mod-meta{font-size:10.5px; color:var(--ink-soft); margin-bottom:8px;}
  .mod-actions{display:flex; gap:8px;}
  .mod-btn{
    font-size:11px; font-weight:700; padding:5px 12px; border-radius:99px; border:none;
  }
  .mod-btn.hide{background:#FCE4E4; color:#C0392B;}
  .mod-btn.show{background:#E7F8EF; color:#0C8C58;}

  /* ---- Hidden ---- */
  .admin-panel{display:none;}
  .admin-panel.active{display:block;}

  /* ---- Toast ---- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:99px;
    font-size:12.5px; font-weight:600; z-index:300; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (min-width:640px){
    .stats-grid{grid-template-columns:repeat(4,1fr); max-width:700px; margin:0 auto;}
    .admin-sec{max-width:700px; margin:0 auto;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div class="admin-gate" id="adminGate">
  <div class="gate-card">
    <div class="appbar-mark">U</div>
    <h2>Admin Panel</h2>
    <p>Enter admin password to continue.</p>
    <input type="password" class="gate-input" id="adminPassword" placeholder="••••••••">
    <button class="btn btn-primary btn-block" id="gateLoginBtn">Enter</button>
  </div>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div class="admin-panel" id="adminPanel">

  <div class="admin-header">
    <div>
      <h1>UTME<em style="color:var(--orange);">Schools</em> Admin</h1>
      <div class="sub">Manage users, payments & content</div>
    </div>
    <button class="admin-logout" id="adminLogoutBtn">Log out</button>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="statTotalUsers">0</div>
      <div class="stat-label">Total users</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statPaidUsers">0</div>
      <div class="stat-label">Paid users</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statTotalResults">0</div>
      <div class="stat-label">Total attempts</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statTotalBookmarks">0</div>
      <div class="stat-label">Bookmarks</div>
    </div>
  </div>

  <!-- Season settings -->
  <div class="admin-sec">
    <h2>Season Settings</h2>
    <div class="season-card">
      <label>Season end date (all paid accounts expire after this)</label>
      <input type="date" id="seasonEndDate">
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" id="saveSeasonBtn">💾 Save season date</button>
    </div>
  </div>

  <!-- Users -->
  <div class="admin-sec">
    <h2>Users <span id="userCount">0</span></h2>
    <input type="text" class="admin-search" id="userSearch" placeholder="🔍 Search by name or email...">
    <div style="overflow-x:auto;">
      <table class="user-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Joined</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Comments moderation -->
  <div class="admin-sec">
    <h2>Comments <span id="commentCount">0</span></h2>
    <div id="commentsModeration"></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
      </html>
