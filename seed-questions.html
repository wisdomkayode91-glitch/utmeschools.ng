<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTMESchools — Question Seeder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0B2545; color: #fff; min-height: 100vh; padding: 20px; }
.container { max-width: 600px; margin: 0 auto; }
h1 { font-size: 22px; margin-bottom: 4px; color: #FFD23F; }
p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
.card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 14px; margin-bottom: 12px; color: #FFD23F; }
select, input { width: 100%; padding: 10px; border-radius: 8px; border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 14px; margin-bottom: 10px; }
select option { background: #0B2545; }
button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
.btn-primary { background: #FF6B35; color: #fff; }
.btn-green { background: #0FA968; color: #fff; }
.btn-grey { background: rgba(255,255,255,0.15); color: #fff; }
.log { background: #000; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 12px; height: 300px; overflow-y: auto; line-height: 1.6; }
.log .success { color: #0FA968; }
.log .error { color: #FF4444; }
.log .info { color: #FFD23F; }
.log .normal { color: #fff; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 12px; text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; color: #FFD23F; }
.stat-label { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }
.progress-wrap { background: rgba(255,255,255,0.1); border-radius: 99px; height: 8px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: #0FA968; border-radius: 99px; transition: width 0.3s; width: 0%; }
</style>
</head>
<body>
<div class="container">
  <h1>🌱 UTMESchools Question Seeder</h1>
  <p>Fetch questions from SdashAPI and store them permanently in Supabase</p>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="statFetched">0</div><div class="stat-label">Fetched</div></div>
    <div class="stat"><div class="stat-num" id="statSaved">0</div><div class="stat-label">Saved</div></div>
    <div class="stat"><div class="stat-num" id="statErrors">0</div><div class="stat-label">Errors</div></div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card">
    <h3>⚙️ Fetch Settings</h3>
    <select id="examType">
      <option value="jamb">JAMB UTME</option>
      <option value="waec">WAEC</option>
      <option value="neco">NECO</option>
      <option value="postutme">Post UTME</option>
    </select>
    <select id="subjectSelect">
      <option value="english">English Language</option>
      <option value="mathematics">Mathematics</option>
      <option value="physics">Physics</option>
      <option value="chemistry">Chemistry</option>
      <option value="biology">Biology</option>
      <option value="government">Government</option>
      <option value="economics">Economics</option>
      <option value="literature">Literature in English</option>
      <option value="geography">Geography</option>
      <option value="accounts">Financial Accounting</option>
      <option value="commerce">Commerce</option>
      <option value="agriculture">Agriculture</option>
      <option value="crk">Christian Religious Studies</option>
      <option value="irk">Islamic Religious Studies</option>
      <option value="history">History</option>
    </select>
    <select id="yearSelect">
      <option value="all">All Years (1988-2025)</option>
      <option value="2025">2025 Only</option>
      <option value="2024">2024 Only</option>
      <option value="2023">2023 Only</option>
      <option value="2022">2022 Only</option>
      <option value="2021">2021 Only</option>
      <option value="2020">2020 Only</option>
      <option value="2019">2019 Only</option>
      <option value="2018">2018 Only</option>
      <option value="2017">2017 Only</option>
      <option value="2016">2016 Only</option>
      <option value="2015">2015 Only</option>
      <option value="2014">2014 Only</option>
      <option value="2013">2013 Only</option>
      <option value="2012">2012 Only</option>
      <option value="2011">2011 Only</option>
      <option value="2010">2010 Only</option>
    </select>
    <button class="btn-primary" onclick="startFetch()">🚀 Fetch & Save to Supabase</button>
    <button class="btn-green" onclick="fetchAllSubjects()">🌍 Fetch ALL Subjects at Once</button>
    <button class="btn-grey" onclick="clearLog()">🗑 Clear Log</button>
  </div>

  <div class="card">
    <h3>📋 Activity Log</h3>
    <div class="log" id="log">
      <div class="info">Ready. Select exam type and subject then click Fetch.</div>
    </div>
  </div>
</div>

<script>
const SDASH_TOKEN  = 'sdash_605172bfa3a9b93e37de87c632f1c06a9fcf7293';
const SUPABASE_URL = 'https://hxrfakdqnuzdigbbvszp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cmZha2RxbnV6ZGlnYmJ2c3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjY0MzgsImV4cCI6MjEwNTAwMjQzOH0.-xz5Y08e_RQ-C6OHKnSfeoVPSV7kAqzeZcL62MO0tOY';
const SDASH_BASE   = 'https://sdashapi.com/api/v1';

let totalFetched = 0, totalSaved = 0, totalErrors = 0;

function log(msg, type = 'normal') {
  const logEl = document.getElementById('log');
  const div = document.createElement('div');
  div.className = type;
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateStats() {
  document.getElementById('statFetched').textContent = totalFetched;
  document.getElementById('statSaved').textContent   = totalSaved;
  document.getElementById('statErrors').textContent  = totalErrors;
}

function clearLog() {
  document.getElementById('log').innerHTML = '<div class="info">Log cleared.</div>';
  totalFetched = totalSaved = totalErrors = 0;
  updateStats();
  document.getElementById('progressFill').style.width = '0%';
}

/* Map our subject IDs to SdashAPI subject names */
const SUBJECT_MAP = {
  english:     'english-language',
  mathematics: 'mathematics',
  physics:     'physics',
  chemistry:   'chemistry',
  biology:     'biology',
  government:  'government',
  economics:   'economics',
  literature:  'literature-in-english',
  geography:   'geography',
  accounts:    'financial-accounting',
  commerce:    'commerce',
  agriculture: 'agriculture',
  crk:         'christian-religious-studies',
  irk:         'islamic-religious-studies',
  history:     'history',
};

async function fetchFromSdash(examType, subject, year, page = 1) {
  let url = `${SDASH_BASE}/questions?exam=${examType}&subject=${subject}&page=${page}&limit=100`;
  if (year && year !== 'all') url += `&year=${year}`;

  const res = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${SDASH_TOKEN}`,
      'Content-Type': 'application/json'
    }
  });

  if (!res.ok) {
    const err = await res.text();
    throw new Error(`SdashAPI error ${res.status}: ${err}`);
  }
  return await res.json();
}

function mapToSupabase(q, examType, subjectId) {
  /* Map SdashAPI question format to our Supabase format */
  const options = q.options || q.choices || {};
  return {
    subject_id:  subjectId,
    exam_type:   examType,
    year:        q.year ? parseInt(q.year) : null,
    topic:       q.topic || q.section || '',
    subtopic:    q.subtopic || '',
    difficulty:  q.difficulty || 'Intermediate',
    text:        q.question || q.text || '',
    option_a:    options.A || options.a || '',
    option_b:    options.B || options.b || '',
    option_c:    options.C || options.c || '',
    option_d:    options.D || options.d || '',
    option_e:    options.E || options.e || null,
    correct:     q.answer || q.correct_answer || q.correct || '',
    explanation: q.solution || q.explanation || q.answer_explanation || '',
    passage:     q.passage || q.comprehension || null,
    sdash_id:    String(q.id || q._id || ''),
  };
}

async function saveToSupabase(questions) {
  /* Save in batches of 50 */
  const BATCH = 50;
  let saved = 0;
  for (let i = 0; i < questions.length; i += BATCH) {
    const batch = questions.slice(i, i + BATCH);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/questions`, {
      method: 'POST',
      headers: {
        'apikey':        SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type':  'application/json',
        'Prefer':        'resolution=ignore-duplicates',
      },
      body: JSON.stringify(batch)
    });
    if (res.ok || res.status === 201) {
      saved += batch.length;
      totalSaved += batch.length;
    } else {
      const err = await res.text();
      log(`Supabase batch error: ${err}`, 'error');
      totalErrors += batch.length;
    }
    updateStats();
  }
  return saved;
}

async function startFetch() {
  const examType  = document.getElementById('examType').value;
  const subjectId = document.getElementById('subjectSelect').value;
  const year      = document.getElementById('yearSelect').value;
  const sdashSubject = SUBJECT_MAP[subjectId] || subjectId;

  log(`Starting: ${examType.toUpperCase()} | ${subjectId} | Year: ${year}`, 'info');

  try {
    /* First call to get total pages */
    const first = await fetchFromSdash(examType, sdashSubject, year, 1);
    const total     = first.total || first.count || 0;
    const totalPages = first.last_page || first.totalPages || Math.ceil(total / 100) || 1;
    const questions  = first.data || first.questions || first.results || [];

    log(`Found ${total} questions across ${totalPages} pages`, 'info');
    totalFetched += questions.length;
    updateStats();

    /* Map and save first page */
    const mapped = questions.map(q => mapToSupabase(q, examType, subjectId));
    await saveToSupabase(mapped);
    log(`Page 1 saved — ${mapped.length} questions`, 'success');

    /* Fetch remaining pages */
    for (let page = 2; page <= totalPages; page++) {
      const data = await fetchFromSdash(examType, sdashSubject, year, page);
      const qs   = data.data || data.questions || data.results || [];
      totalFetched += qs.length;
      updateStats();

      const mappedQs = qs.map(q => mapToSupabase(q, examType, subjectId));
      await saveToSupabase(mappedQs);
      log(`Page ${page}/${totalPages} saved — ${mappedQs.length} questions`, 'success');

      /* Progress bar */
      document.getElementById('progressFill').style.width = `${(page / totalPages) * 100}%`;

      /* Small delay to avoid rate limiting */
      await new Promise(r => setTimeout(r, 300));
    }

    document.getElementById('progressFill').style.width = '100%';
    log(`✅ DONE! ${totalSaved} questions saved to Supabase successfully.`, 'success');

  } catch(e) {
    log(`❌ Error: ${e.message}`, 'error');
    totalErrors++;
    updateStats();
  }
}

async function fetchAllSubjects() {
  const examType = document.getElementById('examType').value;
  const year     = document.getElementById('yearSelect').value;
  const subjects = Object.keys(SUBJECT_MAP);

  log(`🌍 Fetching ALL ${subjects.length} subjects for ${examType.toUpperCase()}`, 'info');

  for (const subjectId of subjects) {
    document.getElementById('subjectSelect').value = subjectId;
    log(`--- Starting ${subjectId} ---`, 'info');
    await startFetch();
    await new Promise(r => setTimeout(r, 500));
  }

  log(`🎉 ALL SUBJECTS COMPLETE! Total saved: ${totalSaved}`, 'success');
}
</script>
</body>
</html>
